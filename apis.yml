aid: enveda-biosciences
name: Enveda
description: 'Enveda (Enveda Biosciences) is a Boulder, Colorado based clinical-stage
  biotechnology company founded in 2019 that discovers medicines by decoding the chemistry of
  the natural world. It combines high-throughput mass spectrometry, metabolomics, robotics and
  machine learning — including PRISM, a foundation model trained on more than a billion small-
  molecule mass spectra — to build a searchable library of plant-derived molecules and translate
  them into drug candidates. Enveda has raised over $360M across Series B, C and D rounds from
  Premji Invest, Kinnevik, Lux Capital, Dimension and Sanofi, reached unicorn status in 2026,
  and runs FDA-cleared clinical programs including ENV-294 (atopic dermatitis and asthma),
  ENV-308 (obesity) and ENV-6946 (inflammatory bowel disease). Enveda publishes no product or
  developer API; the machine-readable surface on enveda.com is a published llms.txt plus the
  WordPress REST API (wp/v2) that serves the company newsroom, In-Veda blog, leadership
  profiles, clinical-trial site directory and media library as JSON, alongside a WordPress MCP
  Adapter endpoint that is present but authentication-gated. Its open science is published as
  research code and data in the github.com/enveda organization.'

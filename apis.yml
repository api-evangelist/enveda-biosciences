apis:
- aid: enveda-biosciences:content
  name: Enveda Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that enveda.com serves at
    /wp-json/wp/v2 — news releases (the `news` custom post type, 34 published), In-Veda blog
    posts, marketing and clinical-trial recruitment pages, leadership / board / advisor profiles
    (`person`, 31 published), a clinical-trial site directory (`wpsl_stores`, 40 published), the
    media library, taxonomies and a site-wide search endpoint, all as JSON with page/per_page
    pagination and X-WP-Total / X-WP-TotalPages headers. This is the CMS content API, not an
    Enveda product API; Enveda publishes no OpenAPI for it, so the definition in this repo was
    derived mechanically from the live route-discovery document at https://enveda.com/wp-json/.'
  humanURL: https://enveda.com/news/
  baseURL: https://enveda.com/wp-json/wp/v2
